# Optimized Training Configuration - Target: F1 96%+, IoU 92%
# Memory-efficient settings for GTX 1650 (4GB)

epochs: 60
batch_size: 6
num_workers: 2
pin_memory: true
seed: 42
debug_mode: false
 
# Gradient accumulation to simulate larger batch size
gradient_accumulation_steps: 3   # Effective batch size = 18

# Optimized optimizer settings
optimizer:
  type: "adamw"
  learning_rate: 8e-5
  weight_decay: 5e-6
  betas: [0.9, 0.999]
  eps: 1e-8

# Learning rate scheduler with warmup
scheduler:
  type: "cosine_warmup"
  warmup_epochs: 5
  T_max: 60
  eta_min: 5e-7

  # fallback params
  step_size: 20
  gamma: 0.5

  # plateau params
  mode: "max"
  patience: 8
  factor: 0.6
  threshold: 0.0005

# Loss function
loss:
  loss_type: "combined"
  dice_weight: 0.5
  focal_weight: 0.5
  aux_weight: 0.3
  focal_alpha: 0.75
  focal_gamma: 2.0
  dice_smooth: 1.0
  iou_smooth: 1.0
  class_weights: [1.0, 10.0]
  reduction: "mean"

# Data augmentation
augmentation:
  enabled: true
  probability: 0.85
  horizontal_flip: 0.5
  vertical_flip: 0.5
  rotation_90: 0.5
  random_rotation: 0.4
  brightness_contrast: 0.4
  gaussian_noise: 0.25
  gaussian_blur: 0.2
  cutout: 0.15
  color_jitter: 0.3
  elastic_transform: 0.15

  rotation_limit: 20
  brightness_limit: 0.25
  contrast_limit: 0.25
  hue_shift_limit: 15
  sat_shift_limit: 20
  noise_var_limit: [0.0, 0.03]
  blur_limit: [3, 5]
  cutout_holes: 6
  cutout_size: 32

  alpha: 120
  sigma: 12
  alpha_affine: 12

# Validation
validation_interval: 1
validation:
  metrics: ["iou", "dice", "precision", "recall", "f1"]
  threshold: 0.45
  early_visualize: true
  save_best_predictions: true

# Early stopping
early_stopping:
  patience: 12
  monitor: "val_fire_f1"
  mode: "max"
  min_delta: 0.001
  restore_best_weights: true

# Checkpointing
checkpoint:
  save_top_k: 5
  monitor: "val_fire_f1"
  mode: "max"
  save_last: true
  dirpath: "checkpoints/"
  filename: "unet-{epoch:02d}-{val_fire_f1:.4f}"
  save_on_train_epoch_end: true

# Logging
logging:
  log_every_n_steps: 15
  save_dir: "logs/"
  name: "fire_detection_optimized"
  project: "forest_fire_unet_optimized"
  wandb:
    enabled: false
    project: "forest-fire-detection-optimized"
    entity: null
    tags: ["unet", "fire-segmentation", "optimized", "gtx1650"]

# Mixed precision (needed for 4GB GPU)
precision: 16
mixed_precision: true
amp_level: "O1"

# Gradient control
gradient_clipping: 1.0
max_grad_norm: 1.0

# Trainer
log_interval: 5
validation_frequency: 1 
save_interval: 5

# TTA
tta:
  enabled: true
  transforms: ["hflip", "vflip", "rot90"]

# Tiling
tile_size: 512
tile_overlap: 64

# Memory optimization
memory_optimization:
  empty_cache_every_n_steps: 50
  gradient_checkpointing: false
  deterministic: false
  benchmark: true

# Post-processing
post_processing:
  min_fire_area: 25
  morphological_closing: true
  closing_kernel_size: 3
  confidence_threshold: 0.45
