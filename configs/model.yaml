model: 
  name: "unet"
  architecture: "unet" 
  backbone: "resnet34" 
  pretrained: true
  in_channels: 3
  num_classes: 1

  # Decoder
  decoder_channels: [256, 128, 64, 32]
  dropout: 0.15
  aux_outputs: true

  # Input
  input_size: [512, 512]

  # Attention
  attention:
    enabled: true
    type: "scse"
    reduction: 16

  # Feature fusion
  feature_fusion:
    enabled: true
    method: "add"

  # Skip connections
  skip_connections:
    type: "residual"
    attention: true

  # Normalization
  normalization:
    type: "batch"
    momentum: 0.1
    eps: 1e-5

  # Activation
  activation:
    decoder: "relu"
    final: "sigmoid"

  # Output head
  output_head:
    intermediate_channels: 16
    use_dropout: true
    dropout_rate: 0.1

  # Inference
  inference:
    tile_size: 512
    tile_overlap: 96
    batch_size: 4
    tta: true
    tta_merge: "mean"

  # Phase 2 (ConvLSTM)
  future:
    temporal_depth: 5
    conv_lstm:
      hidden_dim: 64
      kernel_size: 3
      num_layers: 2
